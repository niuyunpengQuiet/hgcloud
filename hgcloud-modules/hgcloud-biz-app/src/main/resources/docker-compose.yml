version: '3.8'

services:
  hgcloud-biz-app:
    build: 
      context: ../../../
      dockerfile: Dockerfile
    image: hgcloud-biz-app:latest
    container_name: hgcloud-biz-app
    ports:
      - "82:82"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MYSQL_HOST=hgcloud-mysql
      - MYSQL_PORT=3306
      - MYSQL_DB=hgcloud
      - MYSQL_USER=root
      - MYSQL_PWD=12345678
      - REDIS_HOST=hgcloud-redis
      - REDIS_PORT=6379
      - REDIS_PWD=
      - REDIS_DB=1
    depends_on:
      - hgcloud-mysql
      - hgcloud-redis
    networks:
      - hgcloud-network

  hgcloud-mysql:
    image: mysql:8.0
    container_name: hgcloud-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=12345678
      - MYSQL_DATABASE=hgcloud
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - hgcloud-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  hgcloud-redis:
    image: redis:7.0
    container_name: hgcloud-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hgcloud-network
    command: redis-server --appendonly yes

networks:
  hgcloud-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
